<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- github pages serves this for any missing path at any depth, so there the links start from the site
       root. opened locally (a file, or a server at the repo root) the plain relative links already work -->
  <script>
    if (location.pathname.indexOf('/portfolio/') === 0) {
      var base = document.createElement('base');
      base.href = '/portfolio/';
      document.head.appendChild(base);
    }
  </script>
  <title>Page not found - Ahsan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Bagel+Fat+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* the home page's night sky, and a 404 whose 0 is the empty spot a star fell out of */
    .lost{
      min-height:100svh;
      display:grid; place-items:center;
      padding:32px 16px;
      text-align:center;
    }
    .lost-code{
      position:relative;
      display:flex; align-items:center; justify-content:center;
      gap:.03em;
      margin-bottom:clamp(28px,4vw,44px);
      font-family:var(--font-display);
      font-size:clamp(120px,22vw,240px);
      line-height:1;
      color:var(--butter);
      text-shadow:.045em .05em 0 var(--lilac-deep);
    }
    /* nudged down to sit level with the 4s, whose letters ride low in their line */
    .lost-zero{ position:relative; width:.66em; height:.78em; translate:0 .07em; }
    .lost-zero svg{ display:block; width:100%; height:100%; overflow:visible; }
    .lost-ring{ fill:none; stroke:var(--lilac); stroke-width:4; stroke-linecap:round; stroke-dasharray:.1 11; }
    /* the star sat in the middle of the 0, drops out, bounces once and lands tilted on the line.
       a fifth of a turn (72deg) looks the same, so 162deg reads as a small 18deg tilt */
    .lost-zero .lost-star{
      position:absolute;
      left:55%; bottom:-.02em;
      width:.26em; height:.26em;
      color:var(--butter);
      filter:drop-shadow(.012em .014em 0 var(--lilac-deep));
      rotate:162deg;
      animation:lost-fall 1.4s cubic-bezier(.5,0,.75,0) .5s both;
    }
    @keyframes lost-fall{
      0%  { translate:-.163em -.28em; rotate:0deg; }
      70% { translate:0 0; rotate:150deg; animation-timing-function:ease-out; }
      82% { translate:0 -.05em; rotate:158deg; animation-timing-function:ease-in; }
      100%{ translate:0 0; rotate:162deg; }
    }
    .lost-title{ font-size:clamp(24px,2.4vw,32px); font-weight:700; }
    .lost-copy{
      max-width:26em;
      margin:10px auto 32px;
      font-size:var(--text-body);
      line-height:1.55;
      color:var(--paper-dim);
      text-wrap:balance;
    }
    @media (prefers-reduced-motion:reduce){ .lost-zero .lost-star{ animation:none; } }
  </style>
</head>

<body class="home">

  <main class="lost">
    <div>
      <p class="lost-code" aria-hidden="true">
        <span>4</span>
        <span class="lost-zero">
          <svg viewBox="0 0 66 78"><ellipse class="lost-ring" cx="33" cy="39" rx="28" ry="34"/></svg>
          <svg class="lost-star" viewBox="-10 -10 20 20"><path d="M0-8.14 2.23-2.21 8.56-1.92 3.61 2.03 5.29 8.14 0 4.66-5.29 8.14-3.61 2.03-8.56-1.92-2.23-2.21Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        <span>4</span>
      </p>
      <h1 class="lost-title">Page not found</h1>
      <p class="lost-copy">The page you're looking for doesn't exist or has moved.</p>
      <a class="btn btn-primary" href="index.html">Back home</a>
    </div>
  </main>

</body>

</html>
