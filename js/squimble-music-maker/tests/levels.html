<!doctype html>
<!--
  how loud every instrument and texture is, so a new one can be set to sit with the others. it renders
  each offline (no speakers needed) and lists its loudness in db, weighted the way ears hear: the
  average, and the loudest second (for textures that come and go). open it in a browser and wait a
  minute or so. headless chrome works too, but read #out over the devtools protocol once it's filled:
  --dump-dom gives up before the renders finish. textures should sit near the vinyl crackle, which
  never gets in the way of the tune
-->
<meta charset="utf-8">
<title>Squimble levels</title>
<pre id="out">rendering...</pre>
<script src="../instruments.js"></script>
<script src="../synth.js"></script>
<script>
const CENTERS = { pad: 57, keys: 62, guitar: 44, bell: 79, lead: 69, bass: 40, drone: 45 };
const tone = { attack: 1, release: 1, bright: 1, detune: 0, vibrato: 0 };
const db = (x) => (x > 0 ? (20 * Math.log10(x)).toFixed(1) : '-inf').padStart(6);

async function measure(id, seconds, play) {
  const rate = 22050;
  // in stereo, through a centred panner like a layer's channel (makeChannel in synth.js), so sounds
  // the synth spreads or places left and right measure as they're heard. a mono render counted them
  // about 3 db too quiet
  const ctx = new OfflineAudioContext(2, rate * seconds, rate);
  // weighted roughly the way ears hear (a weighting): a low hum counts for much less than a hiss
  // and through the instrument's own chain, if it has one (a guitar's amp, a violin's body, an organ's
  // leslie: instrumentChain in synth.js)
  const input = ctx.createGain();
  const rig = instrumentChain(ctx, recorded(INSTRUMENTS[id]) || INSTRUMENTS[id]);
  if (rig) input.connect(rig.input);
  const low = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 200, Q: 0.5 });
  const high = new BiquadFilterNode(ctx, { type: 'lowpass', frequency: 10000, Q: 0.5 });
  (rig ? rig.output : input).connect(new StereoPannerNode(ctx)).connect(low).connect(high).connect(ctx.destination);
  play(ctx, { input }, { instrument: id, tone });
  const rendered = await ctx.startRendering();
  const [left, right] = [rendered.getChannelData(0), rendered.getChannelData(1)];
  const data = left;
  let sum = 0;
  let loudest = 0;
  for (let at = 0; at < data.length; at += rate) {
    let second = 0;
    for (let i = at; i < Math.min(data.length, at + rate); i++) second += left[i] * left[i] + right[i] * right[i];
    sum += second;
    loudest = Math.max(loudest, Math.sqrt(second / rate));
  }
  return [Math.sqrt(sum / data.length), loudest];
}

// how each kind of sound is measured: textures for a long while, drums as a beat, rhythm guitars as a
// power chord (the way they're played), everything else one held note
async function level(id, inst) {
  if (inst.kind === 'texture') return measure(id, 40, (ctx, channel, layer) => playNote(ctx, channel, layer, { midi: 60, dur: 80, vel: 1 }, 0, 0.5));
  if (inst.kind === 'drums') return measure(id, 4, (ctx, channel, layer) => { for (let i = 0; i < 8; i++) playNote(ctx, channel, layer, { midi: [0, 2, 1, 2][i % 4], dur: 0.25, vel: 1 }, i * 0.5, 0.5); });
  if (inst.family === 'guitar') return measure(id, 4, (ctx, channel, layer) => { for (const midi of [44, 51, 56]) playNote(ctx, channel, layer, { midi, dur: 4, vel: 1 }, 0, 0.5); });
  return measure(id, 4, (ctx, channel, layer) => playNote(ctx, channel, layer, { midi: CENTERS[inst.family], dur: 4, vel: 1 }, 0, 0.5));
}

(async () => {
  const lines = [];
  // synthesised first (nothing's loaded yet)
  for (const [id, inst] of Object.entries(INSTRUMENTS)) {
    const [average, loudest] = await level(id, inst);
    lines.push(`${inst.family.padEnd(8)} ${id.padEnd(14)} average ${db(average)}  loudest second ${db(loudest)}`);
  }
  // then the recordings (RECORDINGS in synth.js), so a recording's sampled.gain, or a recorded drum's
  // level, can be set to match. they need the files, so open this through a web server, or in
  // headless chrome (headless.js lets it read files)
  RECORDINGS.root = '../../../assets/squimble-music-maker/samples/';
  for (const [id, inst] of Object.entries(INSTRUMENTS)) {
    const folders = sampleFolders(inst);
    if (!folders.length) continue;
    await Promise.all(folders.map(loadSamples));
    if (!folders.every(sampleSet)) {
      lines.push(`recorded ${id.padEnd(14)} didn't load`);
      continue;
    }
    const [average, loudest] = await level(id, inst);
    lines.push(`recorded ${id.padEnd(14)} average ${db(average)}  loudest second ${db(loudest)}`);
  }
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
