<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Wizard Battles - uni original</title>
  <!-- the game as I handed it in, shown inside wizard-battles.html when you pick "Uni original". sketch.js is
       the original apart from where the slides live. these are the original project's button styles -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: #5f3e2c; }
    #canvas-wrapper canvas { display: block; }
    button { cursor: pointer; touch-action: manipulation; transition: filter .15s ease, transform .15s ease, box-shadow .15s ease; }
    .attackButton, .defendButton, .healButton { width: 85px; height: 85px; margin: 0; padding: 0; }
    .hoverColor1:hover { filter: brightness(1.22); transform: translateY(-2px); }
    .hoverColor2:hover, .attackButton:hover, .defendButton:hover, .healButton:hover { filter: brightness(1.15); }
    .fireHover:hover { filter: brightness(1.25); box-shadow: 0 0 14px 3px rgba(255,90,60,.55); }
    .waterHover:hover { filter: brightness(1.25); box-shadow: 0 0 14px 3px rgba(70,180,255,.55); }
    .earthHover:hover { filter: brightness(1.25); box-shadow: 0 0 14px 3px rgba(90,200,80,.55); }
    .neutralHover:hover { filter: brightness(1.3); box-shadow: 0 0 14px 3px rgba(220,220,220,.5); }
  </style>
</head>

<body>
  <div id="canvas-wrapper"></div>
  <script src="js/wizard-battles/p5.min.js"></script>
  <script src="js/wizard-battles/sketch.js"></script>
</body>

</html>
