<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- one tile of the wizard battles table: runes and signs scratched into the wood, placed by hand so the
       repeat isn't obvious. wizard-battles.css lays it twice at different sizes. the three triangles are the
       game's elements (fire, water, earth) in its own colours, sunk into the wood -->
  <defs>
    <path id="fehu" d="M0-12V12M0-12 9-6M0-3 9 3"/>
    <path id="algiz" d="M0-12V12M0-2-8-11M0-2 8-11"/>
    <path id="othala" d="M0-12 8-3-6 12M0-12-8-3 6 12"/>
    <path id="thurisaz" d="M-4-12V12M-4-6 5 0-4 6"/>
    <path id="dagaz" d="M-9-10V10L9-10V10Z"/>
    <path id="sowilo" d="M-5-12 5-4-5 4 5 12"/>
    <path id="ingwaz" d="M0-10 8 0 0 10-8 0Z"/>
    <path id="fire" d="M0-10 10 8H-10Z"/>
    <path id="water" d="M0 10 10-8H-10Z"/>
    <path id="earth" d="M0 10 10-8H-10ZM-6.5-1.5H6.5"/>
    <g id="sun"><circle r="9"/><circle r="2" fill="#4f382e" stroke="none"/></g>
    <path id="moon" d="M4-11A11 11 0 1 0 4 11 8.5 8.5 0 1 1 4-11Z"/>
    <path id="spark" d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z"/>
  </defs>

  <g fill="none" stroke="#4f382e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <use href="#fehu" transform="translate(40 52) rotate(-8)"/>
    <use href="#algiz" transform="translate(288 40) rotate(10)"/>
    <use href="#sun" transform="translate(60 172)"/>
    <use href="#dagaz" transform="translate(152 192) rotate(-6) scale(.85)"/>
    <use href="#sowilo" transform="translate(338 206) rotate(12)"/>
    <use href="#othala" transform="translate(212 302) rotate(4)"/>
    <use href="#ingwaz" transform="translate(420 300)"/>
    <use href="#thurisaz" transform="translate(42 402) rotate(8)"/>
    <use href="#algiz" transform="translate(452 410) rotate(-12) scale(.8)"/>
  </g>

  <g fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <use href="#fire" stroke="#653229" transform="translate(412 58) rotate(6)"/>
    <use href="#water" stroke="#2f475e" transform="translate(96 282) rotate(-10)"/>
    <use href="#earth" stroke="#374f30" transform="translate(152 424) rotate(-6)"/>
  </g>

  <g fill="#6b5233">
    <use href="#moon" transform="translate(198 88) rotate(-20)"/>
    <use href="#moon" transform="translate(272 396) rotate(150) scale(.8)"/>
  </g>

  <g fill="#f6c96b">
    <use href="#spark" transform="translate(118 30) scale(.6)" opacity=".45"/>
    <use href="#spark" transform="translate(252 162)" opacity=".5"/>
    <use href="#spark" transform="translate(362 442) scale(.7)" opacity=".4"/>
    <use href="#spark" transform="translate(300 272) scale(.5)" opacity=".35" fill="#f6ead6"/>
  </g>

  <g fill="#f6ead6" opacity=".22">
    <circle cx="350" cy="92" r="1.6"/>
    <circle cx="432" cy="172" r="1.3"/>
    <circle cx="182" cy="250" r="1.5"/>
    <circle cx="380" cy="122" r="1"/>
    <circle cx="20" cy="300" r="1.4"/>
    <circle cx="240" cy="462" r="1.2"/>
    <circle cx="470" cy="250" r="1"/>
    <circle cx="110" cy="112" r="1.2"/>
  </g>
</svg>
